name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor iOS project
        run: npm run ios:prepare

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VRCXDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/VRCXDerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/VRCX.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "VRCX-Mobile-iOS-v2.0.0-unsigned.ipa"
          shasum -a 256 "VRCX-Mobile-iOS-v2.0.0-unsigned.ipa" > "VRCX-Mobile-iOS-v2.0.0-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VRCX-Mobile-iOS-v2.0.0-unsigned
          path: |
            VRCX-Mobile-iOS-v2.0.0-unsigned.ipa
            VRCX-Mobile-iOS-v2.0.0-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
